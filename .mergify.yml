queue_rules:
  - name: default
    merge_method: squash
    merge_conditions:
      - check-success = quality
      - check-success = test
      - check-success = test-cross-platform (ubuntu-latest, Linux)
      - check-success = test-cross-platform (ubuntu-22.04, Linux)
      - check-success = test-cross-platform (macos-latest, macOS)
      - check-success = test-cross-platform (windows-latest, Windows)
      - check-success = coverage
    autoqueue: true
    branch_protection_injection_mode: none
    queue_conditions:
      - and:
          - and:
              - check-success = DCO
              - label = lgtm
          - or:
              - author = dependabot[bot]
              - author = dosubot[bot]
pull_request_rules:
  - name: Auto-approve and queue dependabot PRs
    conditions:
      - base = main
      - author = dependabot[bot]
      - -draft
      - label != do-not-merge
      - -files~=\.github/workflows/release\.yml
    actions:
      review:
        type: APPROVE
        message: Automatically approved by Mergify
      queue:
        name: default
  - name: Auto-approve and queue dosu PRs
    conditions:
      - base = main
      - author = dosubot[bot]
      - -draft
      - label != do-not-merge
    actions:
      review:
        type: APPROVE
        message: Automatically approved by Mergify
      queue:
        name: default
  - name: Auto-queue release-plz PRs
    conditions:
      - base = main
      - head ~= ^release-plz-
      - -draft
      - label != do-not-merge
    actions:
      queue:
        name: default
  - name: Queue maintainer PRs with lgtm label
    conditions:
      - base = main
      - author=@maintainers
      - -draft
      - label = lgtm
      - label != do-not-merge
    actions:
      queue:
        name: default
  - name: Queue external PRs when approved by maintainer
    conditions:
      - base = main
      - -author=@maintainers
      - author != dependabot[bot]
      - author != dosubot[bot]
      - -head ~= ^release-plz-
      - -draft
      - approved-reviews-by=@maintainers
      - label != do-not-merge
    actions:
      queue:
        name: default
  - name: Keep PRs up to date with main
    conditions:
      - base = main
      - -conflict
      - -draft
      - -author = dependabot[bot]
      - label != do-not-merge
    actions:
      update: {}
merge_protections:
  - name: Enforce conventional commit
    description: Make sure that we follow https://www.conventionalcommits.org/en/v1.0.0/
    if:
      - base = main
    success_conditions:
      - "title ~=
        ^(fix|feat|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\\(\
        .+\\))?!?:"
  - name: CI must pass
    description: >-
      All CI checks must pass. This protection prevents manual merges
      that bypass the merge queue. Release-plz PRs are exempt because
      they only bump versions and changelogs (code was already tested
      on main), and GITHUB_TOKEN-triggered force-pushes suppress CI.
    if:
      - base = main
      - "-head ~= ^release-plz-"
    success_conditions:
      - check-success = quality
      - check-success = test
      - check-success = test-cross-platform (ubuntu-latest, Linux)
      - check-success = test-cross-platform (ubuntu-22.04, Linux)
      - check-success = test-cross-platform (macos-latest, macOS)
      - check-success = test-cross-platform (windows-latest, Windows)
      - check-success = coverage
  - name: Do not merge outdated PRs
    description: Make sure PRs are within 10 commits of the base branch before merging
    if:
      - base = main
    success_conditions:
      - "#commits-behind <= 10"
