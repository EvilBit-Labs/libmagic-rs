[package]
name = "libmagic-rs"
version = "0.10.0"
edition = "2024"
authors = ["UncleSp1d3r <unclespid3r@evilbitlabs.io>"]
description = "A pure-Rust implementation of libmagic for file type identification"
license = "Apache-2.0"
repository = "https://github.com/EvilBit-Labs/libmagic-rs"
homepage = "https://evilbit-labs.github.io/libmagic-rs/"
documentation = "https://docs.rs/libmagic-rs"
keywords = ["file", "magic", "libmagic", "file-type", "identification"]
categories = ["command-line-utilities", "parsing"]
rust-version = "1.89"
readme = "README.md"
exclude = [
    "/spec",
    "/docs",
    "/.kiro",
    "/.cursor",
    "/.vscode",
    "/.github",
    "/.git",
    "/.env.*",
    "*.orig",
    "AGENTS.md",
    # `fuzz/` is a standalone cargo-fuzz crate that depends on
    # `libfuzzer-sys` (nightly-only) and links against LLVM's
    # libFuzzer runtime. Excluding it from the parent workspace keeps
    # `cargo check` / `cargo test` / `cargo nextest` on a stable
    # toolchain; fuzz targets are built from inside the fuzz/
    # directory via `cargo +nightly fuzz run <target>`.
    "/fuzz",
]

# Opt this package into the workspace lint table below. Without this,
# [workspace.lints] is inert and none of the security lints apply.
[lints]
workspace = true

# Workspace lint configuration
[workspace.lints.rust]
# Security: Deny unsafe code globally. "deny" rather than "forbid" because the
# memory-mapping call in src/io/mod.rs requires one vetted, SAFETY-commented
# `unsafe` block (memmap2's `map()` is inherently unsafe); `forbid` would make
# that exception impossible. Any new `#[allow(unsafe_code)]` must document its
# safety invariants and pass `clippy::undocumented_unsafe_blocks` (deny).
unsafe_code = "deny"
# Zero warnings policy
warnings = "deny"

[workspace.lints.clippy]
# Pedantic clippy configuration with proper priorities.
# nursery is "allow": its lints are explicitly unstable and produce false
# positives (missing_const_for_fn, option_if_let_else, redundant_pub_crate);
# individually-listed nursery lints below still apply at their stated level.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Security-focused linting.
# Lints marked "allow" below with a tracking note are aspirational: enforcing
# them today would require a codebase-wide cleanup that must be reviewed on
# its own. They are kept in the table (rather than deleted) so the intent is
# visible and flipping one on is a one-line change.
# `as usize` widening from u32 is documented practice (GOTCHAS S5.1); the
# pedantic cast_possible_truncation/cast_sign_loss lints already catch the
# dangerous casts. Tracked for cleanup.
as_conversions = "allow"
as_ptr_cast_mut = "warn"
cast_ptr_alignment = "warn"
float_cmp = "warn"
indexing_slicing = "warn"
# Offset/buffer math already uses checked_add per GOTCHAS S5.2; blanket
# checked arithmetic (line counters, capacity hints) tracked for cleanup.
arithmetic_side_effects = "allow"
integer_division = "warn"
modulo_arithmetic = "warn"
expect_used = "warn"

# Security anti-patterns
# allow_attributes = "warn" # I think we need them for test and benchmarks
dbg_macro = "warn"
# print_stdout = "warn" # TODO: Revisit this
# print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
panic = "deny"          # DON'T PANIC IN PRODUCTION (it would be forbidden, but it breaks clap for some reason, so just don't do it)
unwrap_used = "deny"      # DON'T UNWRAP IN PRODUCTION
# Public enums (TypeKind, Operator, Value, ...) are deliberately exhaustive
# pre-1.0; complete #[non_exhaustive] coverage is a v1.0.0 roadmap item
# (see AGENTS.md Development Phases).
exhaustive_enums = "allow"

# Performance and correctness
perf = { level = "warn", priority = -1 }
await_holding_lock = "deny"
clone_on_ref_ptr = "warn"
create_dir = "warn"
exit = "warn"
filetype_is_file = "warn"
float_equality_without_abs = "warn"
if_then_some_else_none = "warn"
# invalid_from_utf8_unchecked = "warn"  # Not available in clippy
large_stack_arrays = "warn"
let_underscore_must_use = "warn"
lossy_float_literal = "warn"
# Parser code maps nom errors wholesale by design; naming every discarded
# error is churn without signal there. Tracked for cleanup.
map_err_ignore = "allow"
match_same_arms = "warn"
missing_assert_message = "warn"
missing_docs_in_private_items = "allow"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
non_ascii_literal = "warn"
non_send_fields_in_send_ty = "warn"
partial_pub_fields = "warn"
# Conflicts with idiomatic match ergonomics (binding by reference in match
# arms); widely considered a noise lint. Tracked for cleanup.
pattern_type_mismatch = "allow"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_binding_to_reference = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
semicolon_inside_block = "warn"
semicolon_outside_block = "warn"
# Idiomatic nom parser chaining rebinds `input`/`rest` constantly (~200 sites
# across parser and evaluator); shadow_same remains active to catch the
# genuinely suspicious cases. Tracked for cleanup.
shadow_reuse = "allow"
shadow_same = "warn"
shadow_unrelated = "allow"
# Pure style (`.to_string()` vs `.to_owned()` on &str); mechanically
# autofixable. Tracked for cleanup.
str_to_string = "allow"
string_add = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
# Existing slice sites derive offsets from char_indices()/len_utf8() and are
# boundary-safe; converting them to .get() needs its own review. New code
# should follow the strip_prefix/strip_suffix policy in AGENTS.md. Tracked
# for cleanup.
string_slice = "allow"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
undocumented_unsafe_blocks = "deny" # We should not have unsafe code in this project, but if we do, we should document it
unnecessary_self_imports = "warn"
# Pure style (10u32 vs 10_u32); mechanically autofixable. Tracked for cleanup.
unseparated_literal_suffix = "allow"
unused_async = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
# Catch-all `_ =>` arms are deliberate architecture for TypeKind/Value
# dispatch (GOTCHAS S2.1: coerce_value_to_type, bytes_consumed, and the
# output matches rely on them so new variants compile without changes).
wildcard_enum_match_arm = "allow"
zero_sized_map_values = "warn"

# Proper, but pedantic
cargo_common_metadata = "warn"
multiple_crate_versions = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "deny"
must_use_candidate = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Public type names like `io::IoError` are established API; renaming to
# satisfy this pedantic lint would be a breaking change with no safety
# benefit.
module_name_repetitions = "allow"
similar_names = "warn"
too_many_lines = "warn"
type_complexity = "warn"
async_yields_async = "warn"
large_futures = "warn"
result_large_err = "warn"

[[bin]]
name = "rmagic"
path = "src/main.rs"

[dependencies]
cfg-if = "1.0.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
clap-stdin = "0.8.1"
clap_complete = "4.6.5"
ctrlc = { version = "3.5.2", features = ["termination"] }
env_logger = "0.11"
log = "0.4"
memchr = "2.8.1"
memmap2 = "0.9.10"
nom = "8.0.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[build-dependencies]
log = "0.4"
nom = "8.0.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
insta = { version = "1.47.2", features = ["json"] }
nix = { version = "0.31.3", features = ["fs"] }
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "evaluation_bench"
harness = false

[[bench]]
name = "io_bench"
harness = false

[[bench]]
name = "regex_bench"
harness = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
overflow-checks = true
strip = true
