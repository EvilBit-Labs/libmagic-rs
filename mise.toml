
# This file is the SOLE source of truth for the rust toolchain on the mise
# path: the `[tools] rust` entry below declares the channel, components, and
# targets explicitly. `rust` is deliberately NOT in
# `idiomatic_version_file_enable_tools` (see `[settings]`), so mise does not
# also read `rust-toolchain.toml` -- that file exists for non-mise rustup users
# only.
#
# Do not re-add `rust` to that list. Doing so makes mise resolve the toolchain
# from BOTH files; when their channels drift, mise installs two separate rust
# toolchains whose component installs collide on hosted CI runners (`detected
# conflict` / `Directory not empty`), breaking every job at toolchain setup.
# The same collision class is why there is no redundant `rustup component add`
# step in CI -- components come from the entry below.
#
# `rust-toolchain.toml` must still track `stable` to match this file, so rustup
# and mise users build on the same compiler. `mise.lock` is committed so a
# given commit resolves a consistent toolchain across machines; note `stable`
# is a moving channel, so this is stable-tracking rather than a frozen version
# pin -- the resolved rustc advances whenever the lockfile is refreshed. When
# bumping rustc: run `mise upgrade rust` and commit `mise.lock`; update
# Cargo.toml `rust-version` if the MSRV moves.
[tools]
rust                        = { version = "stable", components = "llvm-tools,cargo,rustfmt,clippy", profile = "default", targets = "aarch64-apple-darwin,aarch64-unknown-linux-gnu,aarch64-pc-windows-msvc,x86_64-apple-darwin,x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl,x86_64-pc-windows-msvc" }
cargo-binstall              = "1.20.1"
cargo-insta                 = "1.48.0"
"cargo:cargo-audit"         = "0.22.2"
"cargo:cargo-deny"          = "0.20.2"
"cargo:cargo-dist"          = "0.32.0"
"cargo:cargo-llvm-cov"      = "0.8.7"
"cargo:cargo-nextest"       = "0.9.140"
"cargo:mdbook"              = "0.5.4"
"cargo:mdbook-linkcheck"    = "0.7.7"
"cargo:mdbook-tabs"         = "1.0.4"
"cargo:mdbook-mermaid"      = "0.17.0"
"cargo:mdbook-toc"          = "0.15.4"
"cargo:mdbook-admonish"     = "1.20.0"
"cargo:mdbook-open-on-gh"   = "3.0.0"
"cargo:mdbook-i18n-helpers" = "0.4.0"
just                        = "1.55.1"
python                      = "latest"
"cargo:cargo-outdated"      = "0.19.0"
"cargo:cargo-release"       = "1.1.2"
"cargo:cargo-auditable"     = "0.7.5"
"cargo:cargo-cyclonedx"     = "0.5.9"
"pipx:mdformat"             = { version = "1.0.0", uvx_args = "--with mdformat-gfm --with mdformat-config --with mdformat-footnote --with mdformat-front-matters --with mdformat-simple-breaks --with mdformat-web --with mdformat-wikilink --with mdformat-gfm-alerts --with mdformat-toc" }
actionlint                  = "1.7.12"
markdownlint-cli2           = "0.23.0"
"cargo:cargo-machete"       = "0.9.2"
"cargo:git-cliff"           = "2.13.1"
scorecard                   = "5.5.0"
"cargo:release-plz"         = "0.3.159"
"pipx:pre-commit"           = "latest"
bun                         = "1.3.14"
shellcheck                  = "0.11.0"

# Many of these settings are defaults, but we are explicit in case they change in the future and to make it clear to users what is enabled.
[settings]
activate_aggressive                 = true
idiomatic_version_file_enable_tools = [ "python", "bun" ]
env_cache                           = true
exec_auto_install                   = true
github_attestations                 = true
lockfile                            = true
pin                                 = true
slsa                                = true

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true

[settings.cargo]
binstall_only = false
