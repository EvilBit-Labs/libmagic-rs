# mdformat configuration - consistent with Prettier and markdownlint
exclude = [
    "venv/**",
    "**/node_modules/**",
    "**/*.txt",
    "**/*.mdc",
    "**/*.tpl.md",
    "**/CHANGELOG.md",
    "target/**",
    "megalinter-reports/**",
    "**/*.result",
    "**/*.testfile",
    "**/SKILL.md",           # AI stuff
    ".claude/**/*",          # AI stuff
    ".tessl/**/*",           # AI stuff
]
validate = true
number = true
wrap = "no"
end_of_line = "lf"
extensions = [
    "gfm",
    "footnote",
    "front_matters",
    "simple_breaks",
    "wikilink",
    "gfm_alerts",
    "toc",
]

[plugin.mkdocs]
align_semantic_breaks_in_lists = true
ignore_missing_references      = true
