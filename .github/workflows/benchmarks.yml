name: Benchmarks

on:
    # Run on schedule (weekly on Sunday at 3 AM UTC)
    schedule:
        - cron: "0 3 * * 0"
    # Run on PRs that modify performance-critical code
    pull_request:
        branches: [main]
        paths:
            - "src/evaluator/**"
            - "src/parser/**"
            - "src/io/**"
            - "benches/**"
            - "Cargo.toml"
    # Allow manual triggering
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    benchmark:
        name: Run Benchmarks
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Cache cargo registry
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-bench-
                      ${{ runner.os }}-cargo-

            - name: Run benchmarks
              run: cargo bench --bench parser_bench --bench evaluation_bench --bench io_bench

            - name: Upload benchmark results
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: benchmark-results
                  path: target/criterion/
                  retention-days: 30

    # Compare benchmarks on PRs
    benchmark-compare:
        name: Compare Benchmarks
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: github.event_name == 'pull_request'

        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0

            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Cache cargo registry
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-bench-
                      ${{ runner.os }}-cargo-

            - name: Install critcmp
              # Pin version + --locked so benchmarks cannot drift
              # across runs. Review finding D-L3.
              run: cargo install --locked --version 0.1.8 critcmp

            - name: Run benchmarks on PR branch
              run: |
                  cargo bench --bench parser_bench --bench evaluation_bench --bench io_bench -- --save-baseline pr

            - name: Checkout main branch
              run: git checkout origin/main

            - name: Run benchmarks on main branch
              continue-on-error: true
              id: main-bench
              run: |
                  cargo bench --bench parser_bench --bench evaluation_bench --bench io_bench -- --save-baseline main

            - name: Compare benchmarks
              if: steps.main-bench.outcome == 'success'
              run: |
                  {
                    echo "## Benchmark Comparison"
                    echo ""
                    echo "Comparing PR branch against main:"
                    echo ""
                    echo '```'
                    critcmp main pr || true
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Skip comparison (no main benchmarks)
              if: steps.main-bench.outcome != 'success'
              run: |
                  {
                    echo "## Benchmark Comparison"
                    echo ""
                    echo "Skipped: main branch does not have matching benchmark targets."
                    echo "Comparison will be available once benchmarks are merged to main."
                  } >> "$GITHUB_STEP_SUMMARY"
