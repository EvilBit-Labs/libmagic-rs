name: Benchmarks

on:
    # Run on schedule (weekly on Sunday at 3 AM UTC)
    schedule:
        - cron: "0 3 * * 0"
    # Run on PRs that modify performance-critical code
    pull_request:
        branches: [main]
        paths:
            - "src/evaluator/**"
            - "src/parser/**"
            - "src/io/**"
            - "benches/**"
            - "Cargo.toml"
    # Allow manual triggering
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    benchmark:
        name: Run Benchmarks
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: jdx/mise-action@v3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-bench-
                      ${{ runner.os }}-cargo-

            - name: Run benchmarks
              run: cargo bench --workspace

            - name: Upload benchmark results
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-results
                  path: target/criterion/
                  retention-days: 30

    # Compare benchmarks on PRs
    benchmark-compare:
        name: Compare Benchmarks
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: jdx/mise-action@v3
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Cache cargo registry
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-bench-
                      ${{ runner.os }}-cargo-

            - name: Install critcmp
              run: cargo install critcmp

            - name: Run benchmarks on PR branch
              run: |
                  cargo bench --bench parser_bench --bench evaluation_bench --bench io_bench -- --save-baseline pr

            - name: Checkout main branch
              run: git checkout origin/main

            - name: Run benchmarks on main branch
              run: |
                  cargo bench --bench parser_bench --bench evaluation_bench --bench io_bench -- --save-baseline main

            - name: Compare benchmarks
              run: |
                  {
                    echo "## Benchmark Comparison"
                    echo ""
                    echo "Comparing PR branch against main:"
                    echo ""
                    echo '```'
                    critcmp main pr || true
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
