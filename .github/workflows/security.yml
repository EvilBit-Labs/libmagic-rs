name: Security

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
              with:
                  install: true
                  install_args: just rust cargo:cargo-deny cargo:cargo-outdated cargo:cargo-dist
                  cache: true
                  cache_key: ${{ runner.os }}-mise-security-${{ hashFiles('**/mise.toml') }}
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run cargo deny check
              run: mise x -- cargo deny check

            - name: Run cargo outdated (informational only)
              # Dropping --exit-code=1: a plain upstream dep release is
              # not a security finding, and failing CI on every bump
              # eroded trust in the security dashboard. cargo audit and
              # cargo deny above are the authoritative gates. (Review
              # finding D-M2.)
              run: mise x -- cargo outdated --depth=1
              continue-on-error: true

            - name: Run dist plan
              run: mise x -- dist plan
