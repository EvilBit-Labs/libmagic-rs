name: Security

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
              with:
                  install: true
                  install_args: just rust cargo:cargo-deny cargo:cargo-outdated cargo:cargo-audit
                  cache: true
                  cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-{{file_hash}}"
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run cargo deny check
              run: mise x -- cargo deny check

            - name: Run cargo audit
              # Hard gate on the PR/CI path: fails the build on a known
              # advisory. Complements audit.yml, which runs
              # actions-rust-lang/audit to file GitHub issues for advisories
              # (scheduled monitoring) rather than blocking a build.
              run: mise x -- cargo audit

            - name: Run cargo outdated (informational only)
              # Dropping --exit-code=1: a plain upstream dep release is
              # not a security finding, and failing CI on every bump
              # eroded trust in the security dashboard. cargo audit and
              # cargo deny above are the authoritative gates. (Review
              # finding D-M2.)
              run: mise x -- cargo outdated --depth=1
              continue-on-error: true
