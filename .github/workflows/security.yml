name: Security

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run cargo deny check
              run: cargo deny check

            - name: Run cargo outdated (informational only)
              # Dropping --exit-code=1: a plain upstream dep release is
              # not a security finding, and failing CI on every bump
              # eroded trust in the security dashboard. cargo audit and
              # cargo deny above are the authoritative gates. (Review
              # finding D-M2.)
              run: cargo outdated --depth=1
              continue-on-error: true

            - name: Run dist plan
              run: dist plan
