name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        shell: bash

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    CI: true
    GITHUB_ACTIONS: true

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Ensure rustfmt and clippy are installed
              run: rustup component add rustfmt clippy

            - name: Check formatting
              run: just lint-rust

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run tests (all features)
              run: cargo nextest run --all-features

            - name: Build release
              run: cargo build --release --all-features

    test-cross-platform:
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: "Linux"
                    - os: ubuntu-22.04
                      platform: "Linux"
                    - os: macos-latest
                      platform: "macOS"
                    - os: windows-latest
                      platform: "Windows"

        runs-on: ${{ matrix.os }}
        needs: test
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - run: cargo nextest run --all-features
            - run: cargo build --release --all-features

    coverage:
        runs-on: ubuntu-latest
        needs: test
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate coverage
              # Use --test-threads=1 to prevent race conditions in stdin-mocking tests
              # that manipulate file descriptors (dup/dup2) which aren't thread-safe
              run: cargo llvm-cov --all-features --no-report -- --test-threads=1

            - name: Combine coverage reports
              run: cargo llvm-cov report --lcov --output-path lcov.info

            - name: Enforce 85% coverage threshold
              run: cargo llvm-cov report --fail-under-lines 85

            - name: Upload to Codecov
              uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
              with:
                  files: lcov.info
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: EvilBit-Labs/libmagic-rs
            - uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
              with:
                  token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
                  files: lcov.info
