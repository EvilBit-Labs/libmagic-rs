# Runs actions-rust-lang/audit, which files GitHub issues for advisories
# (scheduled monitoring; needs issues: write). Complementary to security.yml,
# which runs `cargo audit` as a hard PR/CI gate alongside cargo deny +
# cargo outdated. Review finding D-L1.
name: "Audit Dependencies"
on:
    push:
        paths:
            # Run if workflow changes
            - ".github/workflows/audit.yml"
            # Run on changed dependencies
            - "**/Cargo.toml"
            - "**/Cargo.lock"
            # Run if the configuration file changes
            - "**/audit.toml"
    # Rerun periodically to pick up new advisories
    schedule:
        - cron: "0 0 * * *"
    # Run manually
    workflow_dispatch:

# Least-privilege default. The `audit` job below declares exactly what it needs
# (contents: read to check out, issues: write to file advisory issues). Setting
# an empty top-level block means any job added later starts with no token
# scopes and must opt in explicitly, rather than silently inheriting the
# repository default. Clears Scorecard Token-Permissions alert #168.
permissions: {}

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
              name: Audit Rust Dependencies
