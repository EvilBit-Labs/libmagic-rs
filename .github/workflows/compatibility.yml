name: Compatibility Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    schedule:
        # Run daily at 2 AM UTC to catch any regressions
        - cron: "0 2 * * *"
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    compatibility-tests:
        name: Compatibility Tests (${{ matrix.os }})
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
              with:
                  install: true
                  cache: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify compatibility test files are available
              run: just verify-compatibility-tests

            - name: Build rmagic
              run: cargo build --release

            - name: Run compatibility tests
              run: cargo test test_compatibility_with_original_libmagic -- --ignored --nocapture

            - name: Upload test results on failure
              if: failure()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              with:
                  name: compatibility-test-results-${{ matrix.os }}
                  path: |
                      target/nextest/
                      target/tmp/
                  retention-days: 7
