name: release-plz

on:
    push:
        branches: [main]

jobs:
    release-plz-release:
        name: Release-plz release
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read # writes use the App token, not GITHUB_TOKEN -- see #449
            id-token: write
        steps:
            # Mint a GitHub App token so the tag push emits a workflow event.
            # Tags pushed with the default GITHUB_TOKEN do NOT trigger other
            # workflows (GitHub's recursion guard), so cargo-dist's release.yml
            # (on: push: tags) never fires and no GitHub Release is created.
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  # persist-credentials required for pushing signed tags via git CLI;
                  # use the App token so the pushed tag triggers release.yml
                  persist-credentials: true
                  token: ${{ steps.app-token.outputs.token }}
            - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
              with:
                  install: true
                  cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-{{file_hash}}"
                  cache: true
            - name: Run release-plz
              uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
              with:
                  command: release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

    release-plz-pr:
        name: Release-plz PR
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write
        concurrency:
            group: release-plz-${{ github.ref }}
            cancel-in-progress: false
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
              with:
                  install: true
                  cache_key: "mise-v1-{{platform}}-{{install_args_hash}}-{{file_hash}}"
                  cache: true
            - name: Run release-plz
              uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
              with:
                  command: release-pr
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
